# TilcAI on mainnet, next to the testnet stack (deploy/docker-compose.yml) on the same host.
#
#   cp deploy/.env.mainnet.example deploy/.env.mainnet     # fill in the secrets
#   docker compose -f deploy/docker-compose.mainnet.yml --env-file deploy/.env.mainnet up -d
#
# It is the same image as testnet with TILCAI_ENV=mainnet: its own project, container, port,
# database volume and API keys. Nothing here is shared with testnet except, optionally, the
# OpenZeppelin Relayer: one relayer can serve both, and the relayer ids keep them apart.
#
#   Relayer already running on this host (the default):
#     RELAYER_URL_MAINNET=http://host.docker.internal:8080
#   Relayer of its own, with independent signers (recommended for production):
#     docker compose … --profile relayer up -d      and  RELAYER_URL_MAINNET=http://relayer-mainnet:8080
#
# The process starts read-only. It moves money only with MAINNET_TRANSACTIONS_ENABLED=true.
name: tilcai-mainnet

services:
  tilcai-mainnet:
    image: ${MAINNET_REGISTRY:-tilcai}/tilcai:${MAINNET_TAG:-local}
    container_name: tilcai-mainnet
    environment:
      TILCAI_ENV: mainnet
      MAINNET_TRANSACTIONS_ENABLED: ${MAINNET_TRANSACTIONS_ENABLED:-false}
      API_HOST: 0.0.0.0
      TILCAI_API_KEYS_MAINNET: ${MAINNET_TILCAI_API_KEYS:?set independent Mainnet API keys}
      DATABASE_PATH_MAINNET: /data/tilcai-mainnet.db
      # The image defaults DATABASE_PATH to /data/tilcai.db: it stays unused, and different.
      RELAYER_URL_MAINNET: ${RELAYER_URL_MAINNET:-http://host.docker.internal:8080}
      RELAYER_API_KEY_MAINNET: ${MAINNET_RELAYER_API_KEY:?set the Mainnet relayer API key}
      RELAYER_AVALANCHE_MAINNET_ID: ${RELAYER_AVALANCHE_MAINNET_ID:-avalanche-mainnet-relayer}
      RELAYER_STELLAR_MAINNET_ID: ${RELAYER_STELLAR_MAINNET_ID:-stellar-mainnet-relayer}
      RELAYER_X402_PLUGIN_ID_MAINNET: ${RELAYER_X402_PLUGIN_ID_MAINNET:-}
      RELAYER_WEBHOOK_SIGNING_KEY_MAINNET: ${MAINNET_WEBHOOK_SIGNING_KEY:-}
      RPC_AVALANCHE_MAINNET: ${RPC_AVALANCHE_MAINNET:-https://api.avax.network/ext/bc/C/rpc}
      RPC_STELLAR_MAINNET: ${RPC_STELLAR_MAINNET:-https://soroban-rpc.mainnet.stellar.gateway.fm}
      HORIZON_STELLAR_MAINNET: ${HORIZON_STELLAR_MAINNET:-https://horizon.stellar.org}
      IRIS_API_URL_MAINNET: https://iris-api.circle.com
      STELLAR_SIMULATION_SOURCE_MAINNET: ${MAINNET_STELLAR_SIMULATION_SOURCE:?set a public G account}
      EVM_MIN_CONFIRMATIONS_MAINNET: ${EVM_MIN_CONFIRMATIONS_MAINNET:-1}
      # Required: the gasless router. The rest are features that stay off while empty.
      CCTP_ROUTER_AVALANCHE_MAINNET: ${CCTP_ROUTER_AVALANCHE_MAINNET:?set the deployed TilcaiCctpRouter}
      CCTP_ROUTER_V2_AVALANCHE_MAINNET: ${CCTP_ROUTER_V2_AVALANCHE_MAINNET:-}
      ACCOUNT_FACTORY_AVALANCHE_MAINNET: ${ACCOUNT_FACTORY_AVALANCHE_MAINNET:-}
      VAULT_AVALANCHE_MAINNET: ${VAULT_AVALANCHE_MAINNET:-}
      ERC4337_ENTRYPOINT_AVALANCHE_MAINNET: ${ERC4337_ENTRYPOINT_AVALANCHE_MAINNET:-}
      ACCOUNT_FACTORY_STELLAR_MAINNET: ${ACCOUNT_FACTORY_STELLAR_MAINNET:-}
      VAULT_STELLAR_MAINNET: ${VAULT_STELLAR_MAINNET:-}
      # Never in mainnet: the process refuses to start with any of these.
      STELLAR_MINT_SUBMITTER: relayer
      STELLAR_OPERATOR_SECRET: ""
      DEV_EVM_PAYER_PRIVATE_KEY: ""
      QR_MOCK_ENABLED: "false"
      # Dashboard: tilcai-web takes mainnet events only with its MONITOR_INGEST_SECRET_MAINNET.
      MONITOR_WEB_URL_MAINNET: ${MONITOR_WEB_URL_MAINNET:-}
      MONITOR_WEB_SECRET_MAINNET: ${MONITOR_WEB_SECRET_MAINNET:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-4000}
      QUOTE_TTL_SECONDS: ${QUOTE_TTL_SECONDS:-900}
      LITESTREAM_REPLICA_URL: ${MAINNET_LITESTREAM_REPLICA_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: [tilcai-mainnet-data:/data]
    # Reaches a relayer or a dashboard published on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${MAINNET_TILCAI_PORT:-18787}:8787"]
    security_opt: [no-new-privileges]
    restart: unless-stopped

  # ── Optional: a relayer only for mainnet (--profile relayer) ──────────────────────────────
  redis-mainnet:
    profiles: [relayer]
    image: redis:7-bookworm
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    volumes: [tilcai-mainnet-redis:/data]
    security_opt: [no-new-privileges]
    restart: unless-stopped

  relayer-mainnet:
    profiles: [relayer]
    image: ${MAINNET_REGISTRY:-tilcai}/relayer:${MAINNET_TAG:-local}
    environment:
      CONFIG_FILE_NAME: config.mainnet.json
      API_KEY: ${MAINNET_RELAYER_API_KEY:?set the Mainnet relayer API key}
      MAINNET_EVM_KEYSTORE_PASSPHRASE: ${MAINNET_EVM_KEYSTORE_PASSPHRASE:-}
      MAINNET_STELLAR_KEYSTORE_PASSPHRASE: ${MAINNET_STELLAR_KEYSTORE_PASSPHRASE:-}
      MAINNET_EVM_KEYSTORE_JSON_B64: ${MAINNET_EVM_KEYSTORE_JSON_B64:-}
      MAINNET_STELLAR_KEYSTORE_JSON_B64: ${MAINNET_STELLAR_KEYSTORE_JSON_B64:-}
      MAINNET_WEBHOOK_SIGNING_KEY: ${MAINNET_WEBHOOK_SIGNING_KEY:-}
      REDIS_URL: redis://redis-mainnet:6379
      REPOSITORY_STORAGE_TYPE: redis
      STORAGE_ENCRYPTION_KEY: ${MAINNET_RELAYER_STORAGE_ENCRYPTION_KEY:-}
      RESET_STORAGE_ON_START: "false"
      RATE_LIMIT_REQUESTS_PER_SECOND: "10"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on: [redis-mainnet]
    ports: ["127.0.0.1:${MAINNET_RELAYER_PORT:-18080}:8080"]
    security_opt: [no-new-privileges]
    restart: unless-stopped

volumes:
  tilcai-mainnet-redis:
  tilcai-mainnet-data:
