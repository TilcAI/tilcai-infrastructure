name: CI/CD
on:
  push:
    branches: [main, feat/continuous-deploy-baneco]
    paths-ignore: ["**/*.md"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: tilcai-infrastructure
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@tilcai"
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        working-directory: tilcai-infrastructure
      - run: npm run lint && npm run typecheck && npm test && git diff --check
        working-directory: tilcai-infrastructure
      - name: Check Soroban preflight and archived evidence offline
        working-directory: tilcai-infrastructure
        run: python3 test/unit/deploy-testnet.test.py && node --test test/local/soroban-ttl/evidence.test.mjs
  verify:
    needs: offline
    if: github.event_name != 'pull_request'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tilcai-infrastructure
      - name: Build API image
        run: |
          set -euo pipefail
          npmrc=$(mktemp)
          trap 'rm -f "$npmrc"' EXIT
          chmod 600 "$npmrc"
          printf '@tilcai:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$npmrc"
          docker build --secret id=npmrc,src="$npmrc" --build-arg VCS_REF=$GITHUB_SHA -f tilcai-infrastructure/deploy/Dockerfile -t tilcai-ci .
      - name: Test real container
        run: |
          docker run -d --name tilcai-ci -e TILCAI_API_KEYS=ci-test-key -p 127.0.0.1:8787:8787 tilcai-ci
          trap 'docker logs tilcai-ci; docker rm -f tilcai-ci' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v3
        # Deliberately disabled until a separately approved release change.
        if: ${{ false }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        # No image publication on push, PR or workflow_dispatch.
        if: ${{ false }}
        run: |
          docker tag tilcai-ci ghcr.io/tilcai/tilcai-api:$GITHUB_SHA
          # GHCR package permissions can lag the initial package creation.
          for attempt in 1 2 3; do
            if docker push ghcr.io/tilcai/tilcai-api:$GITHUB_SHA; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
    permissions:
      contents: read
      packages: read
  deploy:
    timeout-minutes: 15
    needs: verify
    # No production deployment on any event until explicitly re-enabled.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: Deploy restricted SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/id_deploy' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -T -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "deploy@$HOST" "$DEPLOY_SHA $DEPLOY_ACTOR"
