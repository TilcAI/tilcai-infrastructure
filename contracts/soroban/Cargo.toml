# TilcAI Soroban contracts. Thin contracts over OpenZeppelin `stellar-accounts`
# (audited library, pinned). Own logic lives only in the crates marked "own" in README.md.
[workspace]
resolver = "2"
members = ["account", "account-factory", "vault", "verifier-ed25519", "verifier-webauthn", "policy-spending-limit"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
repository = "https://github.com/TilcAI/tilcai-infrastructure"

[workspace.dependencies]
# Same SDK and feature set as stellar-contracts v0.7.2.
soroban-sdk = { version = "=26.1.0", features = ["experimental_spec_shaking_v2"] }
stellar-accounts = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
